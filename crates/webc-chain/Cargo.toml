[package]
name = "webc-chain"
version = "0.1.0"
# Not published to crates.io: an internal workspace prototype crate.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core protocol types and state transition logic for WEBC."

[lints]
workspace = true

[dependencies]
webc-crypto = { path = "../webc-crypto" }
# Deterministic, gas-metered WASM execution engine for the untrusted-bytecode
# contract path (Phase 7b). Kept behind the crate boundary so the interpreter
# (wasmi today) can be swapped for a JIT later without touching this crate's
# gas model, manifest schema, or contract ABI.
webc-vm = { path = "../webc-vm" }
bincode.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Property tests exercise long hostile operation sequences. Default features
# are unnecessary because tests run in-process and do not require fork/timeouts.
proptest = { version = "1.6", default-features = false, features = ["std"] }
# Compiles WAT text fixtures to wasm bytes for the end-to-end contract tests.
wat = "1.253"
# Samples this test process's resident set during the opt-in capacity benchmark.
# sysinfo 0.39.6 is MIT-licensed, maintained, and kept test-only; disabling its
# unrelated hardware/network features avoids pulling commodity probes we do not use.
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
