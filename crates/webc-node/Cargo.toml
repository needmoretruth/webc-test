[package]
name = "webc-node"
version = "0.1.0"
# Not published to crates.io: an internal workspace prototype crate.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Prototype CLI node/demo tool for WEBC."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
webc-chain = { path = "../webc-chain" }
webc-crypto = { path = "../webc-crypto" }
webc-storage = { path = "../webc-storage" }
webc-net = { path = "../webc-net" }
webc-proof = { path = "../webc-proof" }
thiserror.workspace = true
hex.workspace = true
# Consensus credentials erase their retained seed on drop. zeroize is
# MIT OR Apache-2.0 and already arrives transitively through the crypto stack.
zeroize.workspace = true
# HTTP/WebSocket developer API. axum (MIT) + tokio (MIT) are Apache-2.0-compatible.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
# Permissive CORS for the devnet developer API so a browser demo on any origin
# can call the node. tower-http is MIT (Apache-2.0-compatible).
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Match axum's transitive tokio-tungstenite so the lockfile carries one version
# of the WebSocket stack, not two (finding D3).
tokio-tungstenite = "0.29"
futures-util = "0.3"
