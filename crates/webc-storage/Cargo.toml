[package]
name = "webc-storage"
version = "0.1.0"
# Not published to crates.io: an internal workspace prototype crate.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Crash-safe durable storage traits and reference backends for WEBC."

[lints]
workspace = true

[dependencies]
webc-chain = { path = "../webc-chain" }
webc-crypto = { path = "../webc-crypto" }
bincode.workspace = true
serde.workspace = true
thiserror.workspace = true
redb = "4.1.0"
# Transparent at-rest value compression (WEBC §15.19/§15.24: zstd on by default
# across wire and storage). The `zstd` crate and its `zstd-safe`/`zstd-sys`
# bindings are MIT / (MIT OR Apache-2.0) — permissive and Apache-2.0-compatible,
# so they pass the cargo-deny licence gate. Pinned behind the storage seam.
zstd = "0.13"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
