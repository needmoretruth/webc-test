[package]
name = "webc-net"
version = "0.1.0"
# Not published to crates.io: an internal workspace prototype crate.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Authenticated peer-to-peer transport and gossip for WEBC devnet nodes."

[lints]
workspace = true

[dependencies]
webc-chain = { path = "../webc-chain" }
webc-crypto = { path = "../webc-crypto" }
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
# Async transport plumbing. All MIT-licensed (Apache-2.0-compatible): tokio for
# the runtime/sockets, tokio-util for the length-delimited frame codec,
# futures-util for Sink/Stream combinators, bytes for zero-copy frame buffers.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
# OS randomness for fresh handshake challenges (reused workspace pin).
rand_core = { workspace = true }

# `io-util` (AsyncReadExt) is test-only: the DoS-hardening tests drive raw
# sockets to exercise handshake timeouts and connection caps.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
