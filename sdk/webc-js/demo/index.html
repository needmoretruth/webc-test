<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WEBC devnet demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #666;
        --accent: #2b6cb0;
        --card: #f5f5f5;
        --ok: #2f855a;
        --warn: #b7791f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #e6e6e6;
          --muted: #9aa0aa;
          --accent: #63b3ed;
          --card: #21252c;
          --ok: #68d391;
          --warn: #f6ad55;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 880px;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }
      .disclaimer {
        color: var(--warn);
        font-weight: 600;
        margin-bottom: 1rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      input {
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--muted);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        min-width: 22rem;
        max-width: 100%;
      }
      button {
        padding: 0.45rem 0.9rem;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .card {
        background: var(--card);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
      }
      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.15rem 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        word-break: break-all;
      }
      .kv .k {
        color: var(--muted);
      }
      #log {
        background: var(--card);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 22rem;
        overflow-y: auto;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <h1>WEBC devnet demo</h1>
    <p class="disclaimer">
      Devnet only. Every WEBC unit here is a valueless test unit — not real funds.
    </p>

    <div class="row">
      <label for="node">Node URL</label>
      <input id="node" value="http://127.0.0.1:8645" />
      <button id="connect">Connect</button>
    </div>

    <div class="card" id="status">Not connected.</div>

    <div class="row">
      <button id="new-wallet" disabled>1. Create wallet</button>
      <button id="faucet" disabled>2. Request faucet</button>
      <button id="refresh" disabled>3. Refresh account + proof</button>
      <button id="transfer" disabled>4. Send 1 WEBC to a new wallet</button>
    </div>

    <div class="card kv" id="wallet-card"></div>
    <div id="log" aria-live="polite"></div>

    <script type="module">
      // The demo imports the built SDK. Build it first (`pnpm build` in
      // sdk/webc-js) and serve this folder's parent so `/dist/index.js` resolves.
      import {
        WebcNodeClient,
        createWallet,
        signTransaction,
        transfer,
        amountFromWhole,
      } from "../dist/index.js";

      const $ = (id) => document.getElementById(id);
      const log = (msg, cls = "") => {
        const line = document.createElement("div");
        if (cls) line.className = cls;
        line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
        $("log").prepend(line);
      };

      let client = null;
      let wallet = null; // the sender wallet
      let subscription = null;

      function renderWallet() {
        const card = $("wallet-card");
        if (!wallet) {
          card.textContent = "No wallet yet.";
          return;
        }
        card.innerHTML = "";
        const add = (k, v) => {
          const kd = document.createElement("div");
          kd.className = "k";
          kd.textContent = k;
          const vd = document.createElement("div");
          vd.textContent = v;
          card.append(kd, vd);
        };
        add("address", wallet.address);
      }

      $("connect").addEventListener("click", async () => {
        try {
          client = new WebcNodeClient($("node").value.trim());
          const health = await client.health();
          $("status").innerHTML =
            `Connected to <b>${health.chainId}</b> · height ${health.height} · ` +
            `faucet ${health.faucetEnabled ? "on" : "off"}`;
          log(`connected: chain ${health.chainId}, height ${health.height}`, "ok");
          $("new-wallet").disabled = false;

          // Live finality: update the status height on every new block.
          subscription?.close();
          subscription = client.subscribeBlocks({
            onBlock: (event) => {
              $("status").innerHTML =
                `Connected to <b>${health.chainId}</b> · height ${event.height} (live)`;
              log(`new block #${event.height}`, "ok");
            },
            onError: (err) => log(`ws error: ${err}`, "warn"),
          });
        } catch (err) {
          log(`connect failed: ${err.message ?? err}`, "warn");
        }
      });

      $("new-wallet").addEventListener("click", async () => {
        wallet = await createWallet();
        renderWallet();
        log(`created wallet ${wallet.address}`);
        $("faucet").disabled = false;
        $("refresh").disabled = false;
        $("transfer").disabled = false;
      });

      $("faucet").addEventListener("click", async () => {
        try {
          const receipt = await client.requestFaucet(wallet.address);
          log(
            `faucet: +${receipt.amount} base units at block #${receipt.blockHeight} — ` +
              receipt.disclaimer,
            "ok",
          );
        } catch (err) {
          log(`faucet failed: ${err.kind ?? ""} ${err.message ?? err}`, "warn");
        }
      });

      $("refresh").addEventListener("click", async () => {
        try {
          const account = await client.account(wallet.address);
          log(`balance: ${account.balance} base units, nonce ${account.nonce}`);
          // Fetch the membership proof and show its root (verification of the
          // Merkle path is available via the SDK block/proof helpers).
          const proof = await client.accountProof(wallet.address);
          log(`account proof root: ${proof.account_root}`);
        } catch (err) {
          log(`refresh failed: ${err.kind ?? ""} ${err.message ?? err}`, "warn");
        }
      });

      $("transfer").addEventListener("click", async () => {
        try {
          const recipient = await createWallet();
          const account = await client.account(wallet.address);
          // Sign a 1 WEBC transfer at the sender's current nonce.
          const oneWebc = amountFromWhole(1n); // decimal base-unit string
          const signed = await signTransaction(
            wallet,
            "webc-devnet-1",
            account.nonce,
            transfer(recipient.address, oneWebc),
            { gasLimit: 1000, maxFeePerUnit: 1, priorityFeePerUnit: 0 },
          );
          const receipt = await client.submitTransaction(signed);
          log(
            `submitted transfer → ${recipient.address} (tx ${receipt.txHash.slice(0, 16)}…); ` +
              `mempool ${receipt.mempoolSize}. Auto-sealed within ~2s.`,
            "ok",
          );
          // Give the node a moment to seal, then show the recipient balance.
          setTimeout(async () => {
            try {
              const to = await client.account(recipient.address);
              log(`recipient balance now ${to.balance} base units`, "ok");
            } catch (err) {
              log(`recipient not funded yet: ${err.message ?? err}`, "warn");
            }
          }, 2500);
        } catch (err) {
          log(`transfer failed: ${err.kind ?? ""} ${err.message ?? err}`, "warn");
        }
      });
    </script>
  </body>
</html>
