name: CI

# Runs on pull requests and on pushes to the default branch only. Intermediate
# pushes to feature/working branches do NOT trigger CI, which keeps the merge
# gate useful while avoiding a run (and a failure email) on every work-in-progress
# push. Merges are still gated because every PR runs the full matrix.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Reject production panic shortcuts
        run: >-
          cargo clippy --locked --workspace --lib --bins --
          -D warnings
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::checked_conversions
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
      - run: cargo run --locked -p webc-node -- demo

  typescript-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Supply-chain gate: known-vulnerable/yanked crates, non-permissive licenses,
  # wildcard versions, and non-crates.io sources all fail the merge. Config in
  # deny.toml. (AGENTS.md "reuse over reinvention" license constraint, enforced.)
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features --locked
          command: check advisories bans licenses sources
          rust-version: 1.96.0
      - name: Audit fuzz dependency graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features --locked
          command: check advisories bans licenses sources
          manifest-path: fuzz/Cargo.toml
          rust-version: 1.96.0

  # JavaScript dependency advisory scan (findings D2). Development tools execute
  # repository code and expose local servers in CI/developer environments, so
  # their moderate-or-higher advisories block the merge alongside shipped deps.
  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm licenses:check

  # Fuzz targets build (and run a short smoke pass) so the harnesses cannot rot.
  # Deep fuzzing runs out-of-band; CI only proves the targets compile and each
  # survives a brief run on the current corpus. Requires nightly + cargo-fuzz.
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: nightly-2026-07-27
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-27 install cargo-fuzz --version 0.13.2 --locked
      - name: Smoke-run each fuzz target
        run: |
          cd fuzz
          cargo +nightly-2026-07-27 metadata --locked --format-version 1 > /dev/null
          targets="$(cargo +nightly-2026-07-27 fuzz list)"
          test -n "$targets"
          while IFS= read -r target; do
            echo "::group::fuzz $target"
            cargo +nightly-2026-07-27 fuzz run "$target" -- -max_total_time=30 -rss_limit_mb=4096
            echo "::endgroup::"
          done <<< "$targets"
