# Fuzz harnesses for WEBC's hostile-input surfaces (plan review §3.6).
#
# Not a workspace member (see the root Cargo.toml `exclude`): libFuzzer requires
# a nightly toolchain and `cargo-fuzz`, so it must never be pulled into a stable
# `cargo build --workspace`. Build/run with:
#   cargo +nightly fuzz run <target>
[package]
name = "webc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bincode = "1.3"
serde_json = "1.0"
webc-chain = { path = "../crates/webc-chain" }
webc-net = { path = "../crates/webc-net" }
webc-node = { path = "../crates/webc-node" }
webc-crypto = { path = "../crates/webc-crypto" }
webc-proof = { path = "../crates/webc-proof" }

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_encode"
path = "fuzz_targets/canonical_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_decode"
path = "fuzz_targets/transaction_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mempool_admission"
path = "fuzz_targets/mempool_admission.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v5_transaction_decode"
path = "fuzz_targets/v5_transaction_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipt_v1_decode"
path = "fuzz_targets/receipt_v1_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_v1_decode"
path = "fuzz_targets/checkpoint_v1_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "finalized_proof_v1_decode"
path = "fuzz_targets/finalized_proof_v1_decode.rs"
test = false
doc = false
bench = false
